<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RFQ Reader</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  body { font-family: Segoe UI, Arial, sans-serif; margin: 0; padding: 12px; font-size: 13px; color: #222; }
  h2 { font-size: 16px; margin: 0 0 8px; }

  th { background: #f0f0f0; position: sticky; top: 0; }

</style>

<body>
  <h2>RFQ Reader</h2>

  <details open>
    <summary>AI provider &amp; API key</summary>
    <div class="row" style="margin-top:8px;">
      <label>Provider</label>

        <option value="gemini">Google Gemini (free tier)</option>

  </div>

  <div id="progressWrap"><div id="progressBar"></div></div>

  <div class="row" id="downloadRow" style="display:none;">
    <button id="downloadBtn" class="secondary">Download Excel (.xlsx)</button>
  </div>

  </div>

  <div class="wrap">

        <tr>
          <th>Lot #</th>
          <th>Description</th>
          <th>Part Number</th>
          <th>Quantity</th>
          <th>Budget</th>
          <th>Manufacturer</th>
          <th>Additional Info</th>
          <th>Tender End Date</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <canvas id="renderCanvas"></canvas>

<script>
const PROVIDER_INFO = {
  gemini: {
    label: 'Google AI Studio (Gemini) key',
    hint: 'Free, no credit card needed. Get one at aistudio.google.com/apikey.',
    settingKey: 'geminiApiKey',
    providerHint: 'Free tier (rate-limited, fine for occasional use). Google may use free-tier requests to improve their models.'
  },
  mistral: {
    label: 'Mistral API key',
    hint: 'Free, no credit card, high volume. Get one at console.mistral.ai (API Keys).',
    settingKey: 'mistralApiKey',
    providerHint: 'Free (high daily volume) but requires opting into Mistral using your data to improve their models. Good multilingual translation + vision (Pixtral).'
  },
  claude: {
    label: 'Anthropic API key',
    hint: 'Requires a funded Anthropic Console account (console.anthropic.com → Plans & Billing).',
    settingKey: 'anthropicApiKey',
    providerHint: 'Paid, pay-as-you-go. Your data is not used for training.'
  }
};

function refreshProviderUI() {
  const provider = document.getElementById('provider').value;
  const info = PROVIDER_INFO[provider];
  document.getElementById('apiKeyLabel').textContent = info.label;
  document.getElementById('apiKeyHint').textContent = info.hint;
  document.getElementById('providerHint').textContent = info.providerHint;
  document.getElementById('apiKey').value = Office.context.roamingSettings.get(info.settingKey) || '';
}

Office.onReady(() => {
  const savedProvider = Office.context.roamingSettings.get('provider') || 'gemini';
  document.getElementById('provider').value = savedProvider;
  refreshProviderUI();

  document.getElementById('provider').addEventListener('change', (e) => {
    Office.context.roamingSettings.set('provider', e.target.value);
    Office.context.roamingSettings.saveAsync();
    refreshProviderUI();
  });

  document.getElementById('apiKey').addEventListener('change', (e) => {
    const provider = document.getElementById('provider').value;
    Office.context.roamingSettings.set(PROVIDER_INFO[provider].settingKey, e.target.value);
    Office.context.roamingSettings.saveAsync();
  });

  document.getElementById('runBtn').addEventListener('click', runExtraction);
  document.getElementById('downloadBtn').addEventListener('click', downloadExcel);
  document.getElementById('retryFailedBtn').addEventListener('click', retryFailedBatches);

  offerRestoreIfAvailable();
});

// ---------- local persistence: survive being interrupted / reopened ----------

function storageKeyForItem() {
  const item = Office.context.mailbox.item;
  const id = (item && (item.itemId || item.internetMessageId)) || 'unknown';
  return 'rfqReaderResults:' + id;
}

function saveProgress(rows, status) {
  try {
    localStorage.setItem(storageKeyForItem(), JSON.stringify({
      subject: (Office.context.mailbox.item && Office.context.mailbox.item.subject) || '',
      rows, status, updatedAt: Date.now()
    }));
  } catch (e) { /* storage full or unavailable - non-fatal */ }
}

function offerRestoreIfAvailable() {
  try {
    const raw = localStorage.getItem(storageKeyForItem());
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (!saved.rows || !saved.rows.length) return;
    const bar = document.createElement('div');
    bar.style.cssText = 'background:#eef6ff;border:1px solid #b6d7ff;padding:8px;border-radius:4px;margin-bottom:10px;';
    const when = new Date(saved.updatedAt).toLocaleString();
    bar.innerHTML = `Found ${saved.rows.length} previously extracted row(s) for this email (saved ${when}). `;
    const restoreBtn = document.createElement('button');
    restoreBtn.textContent = 'Restore';
    restoreBtn.className = 'secondary';
    restoreBtn.onclick = () => {
      lastRows = saved.rows;
      renderTable(lastRows);
      setStatus(`Restored ${lastRows.length} row(s) from a previous run (${when}).`);
      bar.remove();
    };
    const dismissBtn = document.createElement('button');
    dismissBtn.textContent = 'Discard';
    dismissBtn.className = 'secondary';
    dismissBtn.onclick = () => { localStorage.removeItem(storageKeyForItem()); bar.remove(); };
    bar.appendChild(restoreBtn);
    bar.appendChild(dismissBtn);
    document.body.insertBefore(bar, document.getElementById('status'));
  } catch (e) { /* ignore */ }
}

let lastRows = [];
let lastBatches = [];              // the batches from the most recent run (for retry)
let lastBodyText = '';
let failedBatchIndices = new Set(); // indices into lastBatches that errored last time
const MAX_IMAGES_PER_BATCH = 8;
const MAX_IMAGE_DIM = 1600;
const MAX_DOCS_PER_BATCH = 8;       // how many source files go into one AI call
const MAX_CHARS_PER_BATCH = 45000;  // safety cap even if a batch has few, huge files
const GEMINI_BATCH_DELAY_MS = 7000; // stay under free-tier requests/minute limits

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function setProgress(done, total) {
  const wrap = document.getElementById('progressWrap');
  const bar = document.getElementById('progressBar');
  if (total <= 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  bar.style.width = Math.round((done / total) * 100) + '%';
}

// ---------- helpers ----------

function base64ToBytes(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function fileExt(name) {
  const m = /\.([a-z0-9]+)$/i.exec(name || '');
  return m ? m[1].toLowerCase() : '';
}

function guessImageMime(ext) {
  if (ext === 'jpg' || ext === 'jpeg') return 'image/jpeg';
  if (ext === 'png') return 'image/png';
  if (ext === 'gif') return 'image/gif';
  if (ext === 'bmp') return 'image/bmp';
  if (ext === 'webp') return 'image/webp';
  return 'image/png';
}

function downscaleImage(base64, mime) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      const scale = Math.min(1, MAX_IMAGE_DIM / Math.max(width, height));
      width = Math.round(width * scale);
      height = Math.round(height * scale);
      const canvas = document.getElementById('renderCanvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      const outMime = mime === 'image/png' ? 'image/png' : 'image/jpeg';
      const dataUrl = canvas.toDataURL(outMime, 0.85);
      resolve({ base64: dataUrl.split(',')[1], mediaType: outMime });
    };
    img.onerror = () => resolve({ base64, mediaType: mime });
    img.src = `data:${mime};base64,${base64}`;
  });
}

async function renderPdfPageToImage(page) {
  const viewport = page.getViewport({ scale: 1.5 });
  const canvas = document.getElementById('renderCanvas');
  canvas.width = Math.min(viewport.width, MAX_IMAGE_DIM);
  const scaleFactor = canvas.width / viewport.width;
  canvas.height = viewport.height * scaleFactor;
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport: page.getViewport({ scale: 1.5 * scaleFactor }) }).promise;
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  return dataUrl.split(',')[1];
}

// ---------- extraction: each source file becomes one "segment" ----------
// segment = { label, text, images: [{name, base64, mediaType}] }

async function extractPdfSegment(bytes, label) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc = await pdfjsLib.getDocument({ data: bytes }).promise;
  let text = '';
  const images = [];
  const sparsePages = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const content = await page.getTextContent();
    const pageText = content.items.map(it => it.str).join(' ');
    text += pageText + '\n';
    if (pageText.trim().length < 40) sparsePages.push(p);
  }
  for (const p of sparsePages.slice(0, 3)) {
    try {
      const page = await doc.getPage(p);
      const b64 = await renderPdfPageToImage(page);
      images.push({ name: `${label} (page ${p}, rendered)`, base64: b64, mediaType: 'image/jpeg' });
    } catch (e) { /* ignore */ }
  }
  return { label, text, images };
}

async function extractDocxSegment(bytes, label) {
  const result = await mammoth.extractRawText({ arrayBuffer: bytes.buffer });
  return { label, text: result.value || '', images: [] };
}

async function extractSpreadsheetSegment(bytes, label) {
  const wb = XLSX.read(bytes, { type: 'array' });
  let text = '';
  wb.SheetNames.forEach(name => {
    text += `\n--- Sheet: ${name} ---\n` + XLSX.utils.sheet_to_csv(wb.Sheets[name]) + '\n';
  });
  return { label, text, images: [] };
}

async function extractImageSegment(base64, mime, label) {
  const scaled = await downscaleImage(base64, mime);
  return { label, text: '', images: [{ name: label, base64: scaled.base64, mediaType: scaled.mediaType }] };
}

async function processZipToSegments(base64) {
  const zip = await JSZip.loadAsync(base64, { base64: true });
  const segments = [];
  const names = Object.keys(zip.files).filter(n => !zip.files[n].dir);
  for (const name of names) {
    const file = zip.files[name];
    const ext = fileExt(name);
    try {
      if (ext === 'pdf') {
        const buf = await file.async('uint8array');
        segments.push(await extractPdfSegment(buf, name));
      } else if (ext === 'docx') {
        const buf = await file.async('uint8array');
        segments.push(await extractDocxSegment(buf, name));
      } else if (ext === 'xlsx' || ext === 'xls' || ext === 'csv') {
        const buf = await file.async('uint8array');
        segments.push(await extractSpreadsheetSegment(buf, name));
      } else if (['jpg','jpeg','png','gif','bmp','webp'].includes(ext)) {
        const b64 = await file.async('base64');
        segments.push(await extractImageSegment(b64, guessImageMime(ext), name));
      } else if (ext === 'dwg' || ext === 'dxf') {
        segments.push({ label: name, text: `(CAD file - not readable in-browser; export as PDF/image to include)`, images: [] });
      }
    } catch (e) {
      segments.push({ label: name, text: `(could not be parsed: ${e})`, images: [] });
    }
  }
  return segments;
}

// ---------- Step 1: gather every source file as a list of segments ----------

function getBodyText() {
  return new Promise((resolve, reject) => {
    Office.context.mailbox.item.body.getAsync(Office.CoercionType.Text, (result) => {
      if (result.status === Office.AsyncResultStatus.Succeeded) resolve(result.value);
      else reject(result.error);
    });
  });
}

function getAttachmentContent(attachmentId) {
  return new Promise((resolve, reject) => {
    Office.context.mailbox.item.getAttachmentContentAsync(attachmentId, (result) => {
      if (result.status === Office.AsyncResultStatus.Succeeded) resolve(result.value);
      else reject(result.error);
    });
  });
}

async function gatherAllSegments() {
  setStatus('Reading email body...');
  const bodyText = await getBodyText();
  const segments = [];

  const attachments = Office.context.mailbox.item.attachments || [];
  let fileCounter = 0;
  for (const att of attachments) {
    const ext = fileExt(att.name);
    try {
      const content = await getAttachmentContent(att.id);
      if (content.format !== Office.MailboxEnums.AttachmentContentFormat.Base64) continue;

      if (ext === 'pdf') {
        setStatus(`Reading attachment: ${att.name} ...`);
        segments.push(await extractPdfSegment(base64ToBytes(content.content), att.name));
      } else if (ext === 'zip') {
        setStatus(`Unpacking ZIP: ${att.name} ...`);
        const zipSegs = await processZipToSegments(content.content);
        setStatus(`Found ${zipSegs.length} file(s) inside ${att.name}.`);
        segments.push(...zipSegs);
      } else if (ext === 'docx') {
        setStatus(`Reading attachment: ${att.name} ...`);
        segments.push(await extractDocxSegment(base64ToBytes(content.content), att.name));
      } else if (ext === 'doc') {
        segments.push({ label: att.name, text: '(legacy .doc not supported - please resend as .docx or PDF)', images: [] });
      } else if (ext === 'xlsx' || ext === 'xls' || ext === 'csv') {
        setStatus(`Reading attachment: ${att.name} ...`);
        segments.push(await extractSpreadsheetSegment(base64ToBytes(content.content), att.name));
      } else if (['jpg','jpeg','png','gif','bmp','webp'].includes(ext)) {
        setStatus(`Reading attachment: ${att.name} ...`);
        const mime = att.contentType && att.contentType.startsWith('image/') ? att.contentType : guessImageMime(ext);
        segments.push(await extractImageSegment(content.content, mime, att.name));
      } else if (ext === 'dwg' || ext === 'dxf') {
        segments.push({ label: att.name, text: '(CAD drawing file - not readable in-browser; please export/attach as PDF or image)', images: [] });
      } else {
        segments.push({ label: att.name, text: '(skipped, unsupported file type)', images: [] });
      }
    } catch (e) {
      segments.push({ label: att.name, text: `(error reading attachment: ${e})`, images: [] });
    }
    fileCounter++;
  }
  return { bodyText, segments };
}

// ---------- Step 2: split segments into batches that fit one AI call ----------

function buildBatches(segments) {
  const batches = [];
  let current = [];
  let currentChars = 0;
  let currentImages = 0;
  for (const seg of segments) {
    const wouldExceed =
      current.length >= MAX_DOCS_PER_BATCH ||
      (current.length > 0 && currentChars + seg.text.length > MAX_CHARS_PER_BATCH) ||
      (current.length > 0 && currentImages + seg.images.length > MAX_IMAGES_PER_BATCH);
    if (wouldExceed) {
      batches.push(current);
      current = [];
      currentChars = 0;
      currentImages = 0;
    }
    current.push(seg);
    currentChars += seg.text.length;
    currentImages += seg.images.length;
  }
  if (current.length) batches.push(current);
  return batches;
}

// ---------- Step 3: send each batch to the chosen AI provider ----------

const SYSTEM_PROMPT = `You extract structured data from procurement / RFQ / tender documents (often in Russian or Kazakh) and translate everything into clear English.

You will receive the email text plus one or more source documents (each clearly marked with "=== FILE: name ===") - these may be PDFs, Word docs, spreadsheets, or images (photos of nameplates, scanned pages, technical drawings). Read any text visible in images too (part numbers, model/serial numbers, manufacturer names, ratings) and use it to fill in or corroborate the fields below. You may only be seeing a subset of a larger tender's files in this particular request - that's fine, just extract everything present here.

Return a JSON array. Each element represents one lot/line item and must have exactly these fields:
- "lot_number": the lot or line number (and purchase/tender number if shown alongside it)
- "description": a concise English description of the item/goods/works/services (translate from Russian/Kazakh)
- "part_number": manufacturer part number / drawing number if present, else ""
- "quantity": quantity and unit (e.g. "5 pcs"), else ""
- "budget": the budgeted/planned amount and currency for that lot, else ""
- "manufacturer": manufacturer/brand/model if mentioned, else ""
- "additional_info": delivery location, payment terms, delivery timeframe, or any other notable requirement, in English, else ""
- "tender_end_date": the deadline for submitting bids/quotes (date and time if available), else ""

If a source document covers multiple lots, return one row per lot. If a document is a single item's spec, return a single row for it. Respond with ONLY the JSON array, no markdown fences, no commentary.`;

function parseJsonArrayFromText(raw) {
  const cleaned = raw.replace(/```json|```/g, '').trim();
  const parsed = JSON.parse(cleaned);
  return Array.isArray(parsed) ? parsed : [parsed];
}

function buildBatchText(bodyText, batch) {
  let text = '=== EMAIL BODY ===\n' + bodyText + '\n\n';
  batch.forEach(seg => {
    text += `=== FILE: ${seg.label} ===\n${seg.text}\n\n`;
  });
  return text;
}

function buildBatchImages(batch) {
  const images = [];
  batch.forEach(seg => images.push(...seg.images));
  return images;
}

async function callClaudeOnce(apiKey, text, images) {
  const content = [{ type: 'text', text }];
  images.forEach(img => {
    content.push({ type: 'text', text: `Image: ${img.name}` });
    content.push({ type: 'image', source: { type: 'base64', media_type: img.mediaType, data: img.base64 } });
  });
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 8192,
      system: SYSTEM_PROMPT,
      messages: [{ role: 'user', content }]
    })
  });
  if (!response.ok) {
    const errText = await response.text();
    const err = new Error(`Anthropic API error ${response.status}: ${errText}`);
    err.status = response.status;
    throw err;
  }
  const data = await response.json();
  const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
  return parseJsonArrayFromText(textBlocks);
}

async function listGeminiFlashModels(apiKey) {
  const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models', {
    headers: { 'x-goog-api-key': apiKey }
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`Gemini ListModels error ${res.status}: ${errText}`);
  }
  const data = await res.json();
  const models = (data.models || [])
    .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => m.name.replace(/^models\//, ''))
    .filter(n => /flash/i.test(n) && !/vision|embedding|tts|image-gen/i.test(n));
  const full = models.filter(n => !/lite/i.test(n));
  const lite = models.filter(n => /lite/i.test(n));
  return [...full, ...lite];
}

async function callGeminiOnce(apiKey, model, text, images) {
  const parts = [{ text }];
  images.forEach(img => {
    parts.push({ text: `Image: ${img.name}` });
    parts.push({ inline_data: { mime_type: img.mediaType, data: img.base64 } });
  });
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
  const response = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
    body: JSON.stringify({
      system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
      contents: [{ role: 'user', parts }],
      generationConfig: { maxOutputTokens: 8192 }
    })
  });
  if (!response.ok) {
    const errText = await response.text();
    const err = new Error(`Gemini API error ${response.status}: ${errText}`);
    err.status = response.status;
    throw err;
  }
  const data = await response.json();
  const candidate = (data.candidates || [])[0];
  const textOut = ((candidate && candidate.content && candidate.content.parts) || [])
    .map(p => p.text || '').join('\n');
  return parseJsonArrayFromText(textOut);
}

let cachedGeminiModels = null;

async function callGeminiBatch(apiKey, text, images) {
  if (!cachedGeminiModels) {
    setStatus('Checking which Gemini models are currently available...');
    cachedGeminiModels = await listGeminiFlashModels(apiKey);
  }
  if (!cachedGeminiModels.length) {
    throw new Error('No usable Gemini Flash models were returned for this API key/account.');
  }

  let lastErr;
  const backoffRounds = [0, 5000, 9000]; // ms delay before each full pass over the remaining models
  for (let round = 0; round < backoffRounds.length; round++) {
    if (backoffRounds[round]) {
      setStatus(`Gemini is busy — retrying in ${Math.round(backoffRounds[round] / 1000)}s...`);
      await new Promise(r => setTimeout(r, backoffRounds[round]));
    }
    for (let idx = 0; idx < cachedGeminiModels.length; idx++) {
      const model = cachedGeminiModels[idx];
      setStatus(`Trying Gemini model "${model}"...`);
      try {
        return await callGeminiOnce(apiKey, model, text, images);
      } catch (e) {
        lastErr = e;
        if (e.status === 404) {
          // This model is gone for this key/account - drop it permanently for the rest of the run.
          cachedGeminiModels.splice(idx, 1);
          idx--;
          continue;
        }
        if ([429, 503, 500].includes(e.status)) {
          continue; // try the next model in this same pass, no need to wait yet
        }
        throw e; // anything else (bad key, etc.) - fail immediately
      }
    }
    if (!cachedGeminiModels.length) break;
  }
  throw lastErr;
}

async function callMistralOnce(apiKey, model, text, images) {
  const content = [{ type: 'text', text }];
  images.forEach(img => {
    content.push({ type: 'text', text: `Image: ${img.name}` });
    content.push({ type: 'image_url', image_url: `data:${img.mediaType};base64,${img.base64}` });
  });
  const response = await fetch('https://api.mistral.ai/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
    body: JSON.stringify({
      model,
      max_tokens: 8192,
      messages: [
        { role: 'system', content: SYSTEM_PROMPT },
        { role: 'user', content }
      ]
    })
  });
  if (!response.ok) {
    const errText = await response.text();
    const err = new Error(`Mistral API error ${response.status}: ${errText}`);
    err.status = response.status;
    throw err;
  }
  const data = await response.json();
  const msg = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  const textOut = typeof msg === 'string' ? msg : (Array.isArray(msg) ? msg.map(c => c.text || '').join('\n') : '');
  return parseJsonArrayFromText(textOut);
}

async function callMistralBatch(apiKey, text, images) {
  // Pixtral handles both text and images; fall back to the text-only large model if it 404s for this key.
  const attempts = [
    { model: 'pixtral-large-latest', delayMs: 0 },
    { model: 'pixtral-large-latest', delayMs: 5000 },
    { model: 'mistral-large-latest', delayMs: 0 },
    { model: 'pixtral-large-latest', delayMs: 9000 }
  ];
  let lastErr;
  for (let i = 0; i < attempts.length; i++) {
    const { model, delayMs } = attempts[i];
    if (delayMs) {
      setStatus(`Mistral is busy — retrying "${model}" in ${Math.round(delayMs / 1000)}s...`);
      await new Promise(r => setTimeout(r, delayMs));
    }
    try {
      return await callMistralOnce(apiKey, model, text, images);
    } catch (e) {
      lastErr = e;
      if (![404, 429, 503, 500].includes(e.status)) throw e;
    }
  }
  throw lastErr;
}

async function callProviderBatch(provider, apiKey, text, images) {
  if (provider === 'gemini') return callGeminiBatch(apiKey, text, images);
  if (provider === 'mistral') return callMistralBatch(apiKey, text, images);
  return callClaudeOnce(apiKey, text, images);
}

// ---------- Step 4: render + export ----------

function renderTable(rows) {
  const tbody = document.querySelector('#resultTable tbody');
  tbody.innerHTML = '';
  const fields = ['lot_number','description','part_number','quantity','budget','manufacturer','additional_info','tender_end_date'];
  rows.forEach(r => {
    const tr = document.createElement('tr');
    fields.forEach(f => {
      const td = document.createElement('td');
      td.textContent = r[f] || '';
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  document.getElementById('resultTable').style.display = rows.length ? 'table' : 'none';
  document.getElementById('downloadRow').style.display = rows.length ? 'block' : 'none';
}

function downloadExcel() {
  if (!lastRows.length) return;
  const headerMap = {
    lot_number: 'Lot Number', description: 'Description', part_number: 'Part Number',
    quantity: 'Quantity', budget: 'Budget', manufacturer: 'Manufacturer',
    additional_info: 'Additional Info', tender_end_date: 'Tender End Date'
  };
  const mapped = lastRows.map(r => {
    const o = {};
    Object.keys(headerMap).forEach(k => { o[headerMap[k]] = r[k] || ''; });
    return o;
  });
  const ws = XLSX.utils.json_to_sheet(mapped);
  ws['!cols'] = [{wch:12},{wch:50},{wch:20},{wch:12},{wch:16},{wch:18},{wch:40},{wch:18}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'RFQ');
  const subjectSafe = (Office.context.mailbox.item.subject || 'RFQ').replace(/[^a-z0-9]+/gi, '_').slice(0, 40);
  XLSX.writeFile(wb, `RFQ_${subjectSafe}.xlsx`);
}

function updateRetryButtonVisibility() {
  const row = document.getElementById('retryRow');
  const btn = document.getElementById('retryFailedBtn');
  if (failedBatchIndices.size > 0) {
    btn.textContent = `Retry ${failedBatchIndices.size} failed batch(es)`;
    row.style.display = 'block';
  } else {
    row.style.display = 'none';
  }
}

function delayBetweenBatches(provider) {
  if (provider === 'gemini') return GEMINI_BATCH_DELAY_MS;
  if (provider === 'mistral') return 3000;
  return 0;
}

async function runBatchAndRecordResult(provider, apiKey, batchIndex, batch, bodyText, isRetry) {
  const names = batch.map(s => s.label).join(', ');
  const label = isRetry ? `Retrying batch ${batchIndex + 1}` : `Batch ${batchIndex + 1}/${lastBatches.length}`;
  setStatus(`${label}: extracting from ${batch.length} file(s)\n(${names.slice(0, 200)}${names.length > 200 ? '...' : ''})`);
  const text = buildBatchText(bodyText, batch);
  const images = buildBatchImages(batch);
  try {
    const rows = await callProviderBatch(provider, apiKey, text, images);
    rows.forEach(r => { r._batchIndex = batchIndex; });
    lastRows = lastRows.concat(rows);
    failedBatchIndices.delete(batchIndex);
    saveProgress(lastRows, `Batch ${batchIndex + 1} succeeded`);
    return true;
  } catch (e) {
    console.error(`Batch ${batchIndex + 1} failed:`, e);
    lastRows.push({
      lot_number: '', description: `[Batch ${batchIndex + 1} failed: ${names.slice(0,120)} — ${e.message}]`,
      part_number: '', quantity: '', budget: '', manufacturer: '', additional_info: '', tender_end_date: '',
      _batchIndex: batchIndex, _failed: true
    });
    failedBatchIndices.add(batchIndex);
    saveProgress(lastRows, `Batch ${batchIndex + 1} failed`);
    return false;
  }
}

async function runExtraction() {
  const provider = document.getElementById('provider').value;
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) {
    setStatus(`Please enter your ${PROVIDER_INFO[provider].label} first.`);
    return;
  }
  cachedGeminiModels = null;
  document.getElementById('runBtn').disabled = true;
  document.getElementById('retryFailedBtn').disabled = true;
  lastRows = [];
  failedBatchIndices = new Set();
  renderTable(lastRows);
  updateRetryButtonVisibility();
  try {
    const { bodyText, segments } = await gatherAllSegments();
    lastBodyText = bodyText;
    lastBatches = buildBatches(segments.length ? segments : [{ label: '(email body only)', text: '', images: [] }]);
    setStatus(`Found ${segments.length} file(s), split into ${lastBatches.length} batch(es) for processing.`);
    setProgress(0, lastBatches.length);

    for (let i = 0; i < lastBatches.length; i++) {
      await runBatchAndRecordResult(provider, apiKey, i, lastBatches[i], bodyText, false);
      renderTable(lastRows);
      updateRetryButtonVisibility();
      setProgress(i + 1, lastBatches.length);
      if (i < lastBatches.length - 1) {
        const delay = delayBetweenBatches(provider);
        if (delay) await new Promise(r => setTimeout(r, delay));
      }
    }
    const failedNote = failedBatchIndices.size ? ` (${failedBatchIndices.size} batch(es) failed — use "Retry failed batches" below)` : '';
    setStatus(`Done. Extracted ${lastRows.length} row(s) from ${segments.length} file(s) across ${lastBatches.length} batch(es).${failedNote}`);
    saveProgress(lastRows, failedBatchIndices.size ? `Complete with ${failedBatchIndices.size} failed batch(es)` : 'Complete');
  } catch (e) {
    setStatus('Error: ' + (e.message || e));
    console.error(e);
  } finally {
    setProgress(0, 0);
    document.getElementById('runBtn').disabled = false;
    document.getElementById('retryFailedBtn').disabled = false;
  }
}

async function retryFailedBatches() {
  const provider = document.getElementById('provider').value;
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) {
    setStatus(`Please enter your ${PROVIDER_INFO[provider].label} first.`);
    return;
  }
  if (!failedBatchIndices.size) return;

  document.getElementById('runBtn').disabled = true;
  document.getElementById('retryFailedBtn').disabled = true;
  const indicesToRetry = Array.from(failedBatchIndices);
  setProgress(0, indicesToRetry.length);

  for (let n = 0; n < indicesToRetry.length; n++) {
    const idx = indicesToRetry[n];
    // Remove the previous placeholder/error row(s) for this batch before retrying.
    lastRows = lastRows.filter(r => r._batchIndex !== idx);
    await runBatchAndRecordResult(provider, apiKey, idx, lastBatches[idx], lastBodyText, true);
    renderTable(lastRows);
    updateRetryButtonVisibility();
    setProgress(n + 1, indicesToRetry.length);
    if (n < indicesToRetry.length - 1) {
      const delay = delayBetweenBatches(provider);
      if (delay) await new Promise(r => setTimeout(r, delay));
    }
  }
  const stillFailed = failedBatchIndices.size;
  setStatus(stillFailed
    ? `Retry finished. ${stillFailed} batch(es) still failing — you can retry again.`
    : `Retry finished. All batches succeeded. ${lastRows.length} row(s) total.`);
  saveProgress(lastRows, stillFailed ? `${stillFailed} batch(es) still failing` : 'Complete');
  setProgress(0, 0);
  document.getElementById('runBtn').disabled = false;
  document.getElementById('retryFailedBtn').disabled = false;
}
